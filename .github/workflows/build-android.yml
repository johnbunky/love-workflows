name: Build Android (reusable)

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      bundle-id:
        required: true
        type: string
      product-name:
        required: true
        type: string
      love-ref:
        required: false
        type: string
        default: "11.5"
      version-string:
        required: false
        type: string
        default: "1.0"
      build-apk:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ───────────────────────────────────────────────────────────────
      # CHECKOUT
      # ───────────────────────────────────────────────────────────────
      - name: Checkout game repo
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────────
      # JAVA
      # ───────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ───────────────────────────────────────────────────────────────
      # PACKAGE GAME
      # ───────────────────────────────────────────────────────────────
      - name: Pack .love file
        run: |
          zip -9 -r game.love . \
            --include "*.lua" \
            --include "*.png" "*.jpg" "*.jpeg" \
            --include "*.ogg" "*.wav" "*.mp3" \
            --include "*.ttf" "*.otf" "*.fnt" \
            --include "*.json" "*.xml" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "android/*"

      # ───────────────────────────────────────────────────────────────
      # CLONE ENGINE
      # ───────────────────────────────────────────────────────────────
      - name: Clone love-android
        run: |
          git clone --recurse-submodules \
            --branch "${{ inputs.love-ref }}" \
            --depth 1 \
            https://github.com/love2d/love-android \
            love-android

      # ───────────────────────────────────────────────────────────────
      # INJECT GAME + RESOURCES
      # ───────────────────────────────────────────────────────────────
      - name: Inject game.love
        run: |
          mkdir -p love-android/app/src/embed/assets
          cp game.love love-android/app/src/embed/assets/game.love

      - name: Copy resources (if exist)
        run: |
          if [ -d "android/res" ]; then
            cp -r android/res/* love-android/app/src/main/res/
          fi

      # ───────────────────────────────────────────────────────────────
      # PATCH CONFIG
      # ───────────────────────────────────────────────────────────────
      - name: Patch app properties
        run: |
          PROPS="love-android/gradle.properties"

          # REMOVE conflicting key completely
          sed -i '/^app\.name_byte_array/d' "$PROPS"

          # Set values
          sed -i "s|^app\.application_id=.*|app.application_id=${{ inputs.bundle-id }}|" "$PROPS"
          sed -i "s|^app\.version_code=.*|app.version_code=${{ github.run_number }}|" "$PROPS"
          sed -i "s|^app\.version_name=.*|app.version_name=${{ inputs.version-string }}|" "$PROPS"
          sed -i "s|^app\.orientation=.*|app.orientation=landscape|" "$PROPS"

          echo "app.name=${{ inputs.app-name }}" >> "$PROPS"

          # Optional JVM tuning
          sed -i "s|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs=-Xmx4g|" "$PROPS"
          
      # ───────────────────────────────────────────────────────────────
      # PATCH ANDROID SDK (REQUIRED FOR PLAY)
      # ───────────────────────────────────────────────────────────────
      - name: Patch Android SDK versions
        run: |
          FILE="love-android/app/build.gradle"

          sed -i 's/minSdkVersion [0-9]\+/minSdkVersion 21/g' "$FILE"
          sed -i 's/targetSdkVersion [0-9]\+/targetSdkVersion 33/g' "$FILE"

      # ───────────────────────────────────────────────────────────────
      # DISABLE SIGNING (CRITICAL FIX)
      # ───────────────────────────────────────────────────────────────
      - name: Disable signing
        run: |
          sed -i '/signingConfig signingConfigs.release/d' love-android/app/build.gradle

      # ───────────────────────────────────────────────────────────────
      # BUILD APK (ARM64 ONLY)
      # ───────────────────────────────────────────────────────────────
      - name: Build APK (arm64, unsigned)
        if: ${{ inputs.build-apk }}
        run: |
          cd love-android
          ./gradlew assembleEmbedNoRecordRelease \
            -Pandroid.injected.build.abi=arm64-v8a \
            --no-daemon

          APK=$(find . -path "*/embedNoRecord*/*.apk" | head -1)
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/${{ inputs.product-name }}-arm64.apk"

      # ───────────────────────────────────────────────────────────────
      # BUILD AAB (UNSIGNED)
      # ───────────────────────────────────────────────────────────────
      - name: Build AAB (unsigned)
        if: ${{ !inputs.build-apk }}
        run: |
          cd love-android
          ./gradlew clean bundleEmbedNoRecordRelease --no-daemon

          AAB=$(find . -name "*.aab" | head -1)
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$AAB" "$GITHUB_WORKSPACE/dist/${{ inputs.product-name }}-unsigned.aab"

      # ───────────────────────────────────────────────────────────────
      # ARTIFACT
      # ───────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.product-name }}-${{ inputs.build-apk && 'apk' || 'aab' }}-${{ github.run_number }}
          path: dist/
          retention-days: 30
