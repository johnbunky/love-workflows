name: Build Android (reusable)

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      bundle-id:
        required: true
        type: string
      product-name:
        required: true
        type: string
      love-ref:
        required: false
        type: string
        default: "11.5"
      version-string:
        required: false
        type: string
        default: "1.0"
      build-type:
        required: false
        type: string
        default: "apk"   # apk | aab

    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout game repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Pack game.love
        run: |
          zip -9 -r game.love . \
            --include "*.lua" \
            --include "*.png" --include "*.jpg" --include "*.jpeg" \
            --include "*.ogg" --include "*.wav" --include "*.mp3" \
            --include "*.ttf" --include "*.otf" --include "*.fnt" \
            --include "*.json" --include "*.xml" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "android/*"

      - name: Generate default icons
        if: ${{ hashFiles('android/res/**') == '' }}
        run: |
          sudo apt-get install -y imagemagick -q
          for d_size in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            d=$(echo $d_size | cut -d' ' -f1)
            s=$(echo $d_size | cut -d' ' -f2)
            mkdir -p android/res/mipmap-$d
            convert -size ${s}x${s} xc:#00aaff \
              -fill white -gravity center \
              -font DejaVu-Sans -pointsize $((s/3)) \
              -annotate 0 "LOVE" \
              android/res/mipmap-$d/ic_launcher.png
          done

      # ── APK (love-actions-android — handles NDK, signing, game launches) ─────
      - name: Build APK
        if: ${{ inputs.build-type == 'apk' }}
        uses: love-actions/love-actions-android@v2
        with:
          app-name:       ${{ inputs.app-name }}
          bundle-id:      ${{ inputs.bundle-id }}
          love-ref:       ${{ inputs.love-ref }}
          love-package:   ./game.love
          resource-path:  ./android/res
          icon-specifier: "@mipmap/ic_launcher"
          product-name:   ${{ inputs.product-name }}
          version-string: ${{ inputs.version-string }}
          version-code:   ${{ github.run_number }}
          output-folder:  ./dist
          
      - name: Verify keystore
        if: ${{ inputs.build-type == 'aab' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Base64 length:"
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | wc -c
          echo "Decoded size:"
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d | wc -c
          
      # ── AAB (raw Gradle — action doesn't support AAB output) ─────────────────
      - name: Clone love-android
        if: ${{ inputs.build-type == 'aab' }}
        run: |
          git clone --recurse-submodules \
            --branch "${{ inputs.love-ref }}" \
            --depth 1 \
            https://github.com/love2d/love-android \
            love-android

      - name: Inject game.love
        if: ${{ inputs.build-type == 'aab' }}
        run: |
          mkdir -p love-android/app/src/embed/assets
          cp game.love love-android/app/src/embed/assets/game.love

      - name: Copy icons
        if: ${{ inputs.build-type == 'aab' }}
        run: |
          cp -r android/res/* love-android/app/src/main/res/

      - name: Patch gradle.properties
        if: ${{ inputs.build-type == 'aab' }}
        run: |
          PROPS="love-android/gradle.properties"
          sed -i '/^app\.name_byte_array/d' "$PROPS"
          sed -i "s|^app\.application_id=.*|app.application_id=${{ inputs.bundle-id }}|" "$PROPS"
          sed -i "s|^app\.version_code=.*|app.version_code=${{ github.run_number }}|" "$PROPS"
          sed -i "s|^app\.version_name=.*|app.version_name=${{ inputs.version-string }}|" "$PROPS"
          sed -i "s|^app\.orientation=.*|app.orientation=landscape|" "$PROPS"
          echo "app.name=${{ inputs.app-name }}" >> "$PROPS"
          sed -i "s|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs=-Xmx4g|" "$PROPS"

      - name: Patch SDK levels
        if: ${{ inputs.build-type == 'aab' }}
        run: |
          FILE="love-android/app/build.gradle"
          sed -i 's/minSdk [0-9]*/minSdk 21/g'               "$FILE"
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' "$FILE"
          sed -i 's/targetSdk [0-9]*/targetSdk 34/g'               "$FILE"
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' "$FILE"

      - name: Disable release signing config
        if: ${{ inputs.build-type == 'aab' }}
        run: |
          sed -i '/signingConfig signingConfigs.release/d' love-android/app/build.gradle

      - name: Build AAB
        if: ${{ inputs.build-type == 'aab' }}
        run: |
          cd love-android
          ./gradlew bundleEmbedNoRecordRelease --no-daemon
          AAB=$(find . -name "*.aab" | head -1)
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$AAB" "$GITHUB_WORKSPACE/dist/${{ inputs.product-name }}-unsigned.aab"

      # ── ARTIFACT ─────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.product-name }}-${{ inputs.build-type }}-${{ github.run_number }}
          path: dist/
          retention-days: 30
