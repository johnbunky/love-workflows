name: Build Android (reusable)

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      bundle-id:
        required: true
        type: string
      product-name:
        required: true
        type: string
      love-ref:
        required: false
        type: string
        default: "11.5"
      version-string:
        required: false
        type: string
        default: "1.0"
      build-apk:
        required: false
        type: boolean
        default: false

    secrets:
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
      KEYSTORE_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout game repo
        uses: actions/checkout@v4

      # Checkout love-workflows to access the committed keystore file
      - name: Checkout love-workflows
        if: ${{ !inputs.build-apk }}
        uses: actions/checkout@v4
        with:
          repository: johnbunky/love-workflows
          path: love-workflows

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Pack .love file
        run: |
          zip -9 -r game.love . \
            --include "*.lua" \
            --include "*.png" --include "*.jpg" --include "*.jpeg" \
            --include "*.ogg" --include "*.wav" --include "*.mp3" \
            --include "*.ttf" --include "*.otf" --include "*.fnt" \
            --include "*.json" --include "*.xml" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "android/*" \
            --exclude "love-workflows/*"

      - name: Generate default icons
        if: ${{ hashFiles('android/res/**') == '' }}
        run: |
          sudo apt-get install -y imagemagick -q
          for d_size in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            d=$(echo $d_size | cut -d' ' -f1)
            s=$(echo $d_size | cut -d' ' -f2)
            mkdir -p android/res/mipmap-$d
            convert -size ${s}x${s} xc:#00aaff \
              -fill white -gravity center \
              -font DejaVu-Sans -pointsize $((s/3)) \
              -annotate 0 "LOVE" \
              android/res/mipmap-$d/ic_launcher.png
          done

      # ── TEST APK (debug, arm64 only, no signing) ──────────────────────────────
      - name: Build APK (test)
        if: ${{ inputs.build-apk }}
        uses: love-actions/love-actions-android@v2
        with:
          app-name:       ${{ inputs.app-name }}
          bundle-id:      ${{ inputs.bundle-id }}
          love-ref:       ${{ inputs.love-ref }}
          love-package:   ./game.love
          resource-path:  ./android/res
          icon-specifier: "@mipmap/ic_launcher"
          product-name:   ${{ inputs.product-name }}
          version-string: ${{ inputs.version-string }}
          version-code:   ${{ github.run_number }}
          output-folder:  ./dist
          extra-assets:   "-Pandroid.injected.build.abi=arm64-v8a"
          # arm64 only — half the size, enough for testing
          libs-path:      ""

      # ── RELEASE AAB (raw Gradle — action doesn't support AAB) ────────────────
      - name: Clone love-android
        if: ${{ !inputs.build-apk }}
        run: |
          git clone --recurse-submodules \
            --branch "${{ inputs.love-ref }}" \
            --depth 1 \
            https://github.com/love2d/love-android \
            love-android

      - name: Inject game.love
        if: ${{ !inputs.build-apk }}
        run: |
          mkdir -p love-android/app/src/embed/assets
          cp game.love love-android/app/src/embed/assets/game.love

      - name: Copy icons
        if: ${{ !inputs.build-apk }}
        run: |
          cp -r android/res/* love-android/app/src/main/res/

      - name: Patch app properties
        if: ${{ !inputs.build-apk }}
        run: |
          cat > love-android/app/gradle.properties << EOF
          app.application_id=${{ inputs.bundle-id }}
          app.version_code=${{ github.run_number }}
          app.version_name=${{ inputs.version-string }}
          app.name=${{ inputs.app-name }}
          app.orientation=landscape
          EOF
          
      - name: Debug build.gradle
        if: ${{ !inputs.build-apk }}
        run: |
          echo "=== build.gradle ==="
          cat -n love-android/app/build.gradle
      - name: Tune Gradle heap
        if: ${{ !inputs.build-apk }}
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" \
            >> love-android/gradle.properties

      - name: Build AAB
        if: ${{ !inputs.build-apk }}
        run: |
          cd love-android
          ./gradlew bundleEmbedNoRecordRelease --no-daemon

      - name: Sign AAB
        if: ${{ !inputs.build-apk }}
        run: |
          AAB=$(find love-android -name "*.aab" | head -1)
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$GITHUB_WORKSPACE/love-workflows/armadillo_jks.keystore" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass   "${{ secrets.KEY_PASSWORD }}" \
            "$AAB" \
            "${{ secrets.KEY_ALIAS }}"
          mkdir -p dist
          cp "$AAB" "dist/${{ inputs.product-name }}-release.aab"

      # ── ARTIFACT ─────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.product-name }}-${{ inputs.build-apk && 'apk' || 'aab' }}-${{ github.run_number }}
          path: dist/
          retention-days: 30
