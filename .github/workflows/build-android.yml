name: Build Android (reusable)

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      bundle-id:
        required: true
        type: string
      product-name:
        required: true
        type: string
      love-ref:
        required: false
        type: string
        default: "11.5"
      version-string:
        required: false
        type: string
        default: "1.0"
      build-type:
        required: false
        type: string
        default: "apk"   # apk | aab

    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout game repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Pack game.love
        run: |
          zip -9 -r game.love . \
            --include "*.lua" \
            --include "*.png" --include "*.jpg" --include "*.jpeg" \
            --include "*.ogg" --include "*.wav" --include "*.mp3" \
            --include "*.ttf" --include "*.otf" --include "*.fnt" \
            --include "*.json" --include "*.xml" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "android/*"

      - name: Clone love-android
        run: |
          git clone --recurse-submodules \
            --branch "${{ inputs.love-ref }}" \
            --depth 1 \
            https://github.com/love2d/love-android \
            love-android

      - name: Inject game.love
        run: |
          mkdir -p love-android/app/src/embed/assets
          cp game.love love-android/app/src/embed/assets/game.love

      - name: Copy icons (if exist)
        run: |
          if [ -d "android/res" ]; then
            cp -r android/res/* love-android/app/src/main/res/
          fi

      - name: Patch gradle.properties
        run: |
          PROPS="love-android/gradle.properties"
          sed -i '/^app\.name_byte_array/d' "$PROPS"
          sed -i "s|^app\.application_id=.*|app.application_id=${{ inputs.bundle-id }}|" "$PROPS"
          sed -i "s|^app\.version_code=.*|app.version_code=${{ github.run_number }}|" "$PROPS"
          sed -i "s|^app\.version_name=.*|app.version_name=${{ inputs.version-string }}|" "$PROPS"
          sed -i "s|^app\.orientation=.*|app.orientation=landscape|" "$PROPS"
          echo "app.name=${{ inputs.app-name }}" >> "$PROPS"
          sed -i "s|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs=-Xmx4g|" "$PROPS"

      - name: Patch SDK levels
        run: |
          FILE="love-android/app/build.gradle"
          sed -i 's/minSdk [0-9]*/minSdk 21/g'               "$FILE"
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' "$FILE"
          sed -i 's/targetSdk [0-9]*/targetSdk 34/g'               "$FILE"
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' "$FILE"

      - name: Disable release signing config
        run: |
          sed -i '/signingConfig signingConfigs.release/d' love-android/app/build.gradle

      # ── APK — arm64, signed with temp debug keystore, installs by tapping ────
      - name: Create debug keystore
        if: ${{ inputs.build-type == 'apk' }}
        run: |
          keytool \
            -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore love-android/debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        if: ${{ inputs.build-type == 'apk' }}
        run: |
          cd love-android
          ./gradlew assembleEmbedNoRecordRelease \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.signing.store.file=$(pwd)/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon
          FILE=$(find . -path "*release*.apk" | head -1)
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$FILE" "$GITHUB_WORKSPACE/dist/${{ inputs.product-name }}.apk"

      # ── AAB — unsigned, sign locally with jarsigner ───────────────────────────
      - name: Build AAB
        if: ${{ inputs.build-type == 'aab' }}
        run: |
          cd love-android
          ./gradlew bundleEmbedNoRecordRelease --no-daemon
          AAB=$(find . -name "*.aab" | head -1)
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$AAB" "$GITHUB_WORKSPACE/dist/${{ inputs.product-name }}-unsigned.aab"

      # ── ARTIFACT ─────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.product-name }}-${{ inputs.build-type }}-${{ github.run_number }}
          path: dist/
          retention-days: 30
